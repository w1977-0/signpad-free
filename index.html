//
// The feel of a real pen comes from three things, all pure math:
//   1. smoothing — pointer input is jittery; a first-order low-pass filter and
//      midpoint quadratic Béziers turn it into a flowing line
//   2. velocity-aware width — fast strokes run thin, slow strokes run fat,
//      exactly like ink flow (the classic Square signature-pad recipe:
//      width interpolates between minWidth and maxWidth as velocity rises)
//   3. continuous strips — variable-width segments render as filled

    lastExport.canvas.toBlob(function (b) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = "signature-" + lastExport.canvas.width + "x" + lastExport.canvas.height + "." + lastExport.ext;
      a.click();
      URL.revokeObjectURL(a.href);
    }, lastExport.type, lastExport.type === "image/jpeg" ? 0.95 : undefined);
  });

  document.getElementById("white").addEventListener("click", function () {
    if (!lastExport) return;
    if (lastExport.type === "image/png") {
      // flatten onto white
      var c = document.createElement("canvas");
      c.width = lastExport.canvas.width; c.height = lastExport.canvas.height;
      var cc = c.getContext("2d");
      cc.fillStyle = "#FFFFFF"; cc.fillRect(0, 0, c.width, c.height);
      cc.drawImage(lastExport.canvas, 0, 0);
      lastExport = { canvas: c, type: "image/jpeg", ext: "jpg" };
      var pr = preview; pr.getContext("2d").clearRect(0, 0, pr.width, pr.height);
      pr.classList.remove("checker");
      pr.getContext("2d").drawImage(c, 0, 0);
      document.getElementById("f-size").textContent = c.width + "×" + c.height + " px (白底)";
      this.textContent = "改回透明 PNG";
    } else {
      updatePreview();
      preview.classList.add("checker");
    }
  });
  syncButtons();
})();
</script>
</body>
</html>
